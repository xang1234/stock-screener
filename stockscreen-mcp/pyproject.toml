[project]
name = "stockscreen-mcp"
dynamic = ["version"]
description = "MCP server for daily stock screens (Minervini, CANSLIM, VCP and more), RS ratings, market breadth and IBD-style group rankings across 12 markets. No API keys or setup."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "David Ten" }]
keywords = ["mcp", "stock-screener", "minervini", "canslim", "relative-strength", "market-breadth", "trading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/xang1234/stock-screener/tree/main/stockscreen-mcp"
Repository = "https://github.com/xang1234/stock-screener"
Issues = "https://github.com/xang1234/stock-screener/issues"
"Live demo" = "https://xang1234.github.io/stock-screener/"

[project.scripts]
stockscreen-mcp = "stockscreen_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/stockscreen_mcp/__init__.py"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the published data on GitHub Pages (run with STOCKSCREEN_LIVE=1)"]
