# MCPB bundle (server.type "uv"): the host installs these dependencies with uv and runs
# server.py. Pins the released package; its version must match ../src/stockscreen_mcp/__init__.py.
[project]
name = "stockscreen-mcp-bundle"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = ["stockscreen-mcp==0.4.0"]

[tool.uv]
package = false
