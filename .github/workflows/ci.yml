name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

# Read-only by default; jobs that publish declare what they need.
permissions:
  contents: read

# Dependency caches (uv, npm) are kept. Only workflows running on main can
# write main-scope caches, and none here run untrusted code there
# (no pull_request_target, issue_comment or workflow_run triggers). PR runs
# write PR-scoped caches that main never restores.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-boundary:
    name: Public/private dependency boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify private Social dependency is absent from public paths
        run: python3 scripts/verify_social_private_boundary.py

  backend:
    name: Backend Quality Gates
    needs: [private-boundary]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost/ci_unused

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-runtime.txt
            backend/requirements-test.txt
            backend/requirements-exposure-documents.txt

      - name: Install dependencies
        run: uv pip install --system -r backend/requirements-runtime.txt -r backend/requirements-test.txt

      - name: Check generated scan-field contracts
        run: python scripts/generate_scan_filter_contract.py --check

      - name: "Gate 0: Theme identity invariants"
        run: make gate-identity

      - name: Gate check (verify all SE test files are assigned)
        run: make gate-check

      - name: "Gate 1: Detector correctness"
        run: make gate-1

      - name: "Gate 2: Temporal integrity"
        run: make gate-2

      - name: Required economic taxonomy PostgreSQL contracts
        run: |
          PGPASSWORD=ci createdb -h localhost -U ci economic_taxonomy_ci
          cd backend
          python scripts/run_required_economic_taxonomy_postgres.py
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/economic_taxonomy_ci
          STOCKSCANNER_TEST_ALLOW_POSTGRES: "1"

      - name: "Gate 4: Performance baselines"
        run: make gate-4

      - name: "Gate 5: Golden regression"
        run: make gate-5

  backend-postgres:
    name: ${{ matrix.name }}
    needs: [private-boundary]
    runs-on: ubuntu-latest
    # Each job takes ~2-5 min; a test blocked on a PostgreSQL lock waits forever,
    # so fail it here instead of at GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Gate 3: Integration coverage"
            db: ci
            run: make gate-3
          - name: Integration and parity sweep
            db: integration_ci
            run: |
              PGPASSWORD=ci createdb -h localhost -U ci integration_ci
              make gate-integration
          - name: Required company exposure S1 PostgreSQL gate
            db: company_exposure_ci
            run: |
              PGPASSWORD=ci createdb -h localhost -U ci company_exposure_ci
              cd backend
              python scripts/run_required_company_exposure_postgres.py --slice S1 \
                --artifact "$RUNNER_TEMP/company-exposure-s1-gate.json"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-runtime.txt
            backend/requirements-test.txt
            backend/requirements-exposure-documents.txt

      - name: Install dependencies
        run: uv pip install --system -r backend/requirements-runtime.txt -r backend/requirements-test.txt

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/${{ matrix.db }}
          STOCKSCANNER_TEST_ALLOW_POSTGRES: "1"

  backend-unit:
    name: Backend Unit Suite (${{ matrix.shard }}/4)
    needs: [private-boundary]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      DATABASE_URL: postgresql://ci:ci@localhost/ci_unused

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/requirements-runtime.txt
            backend/requirements-test.txt
            backend/requirements-exposure-documents.txt

      - name: Install dependencies
        run: uv pip install --system -r backend/requirements-runtime.txt -r backend/requirements-test.txt

      - name: Comprehensive backend unit suite (shard ${{ matrix.shard }}/4)
        shell: bash
        run: |
          gate_unit_file="${RUNNER_TEMP}/backend-gate-unit-files.txt"
          make gate-unit-files > "${gate_unit_file}"
          # The company exposure S1 job already runs these on PostgreSQL, the only supported dialect.
          python -c 'import json; print("\n".join(p for p in json.load(open("backend/tests/required_company_exposure_cases.json"))["slices"]["S1"]["paths"] if p.startswith("tests/unit/")))' >> "${gate_unit_file}"

          cd backend
          ignore_args=()
          while IFS= read -r path; do
            [[ -n "${path}" ]] || continue
            ignore_args+=(--ignore "${path}")
          done < "${gate_unit_file}"

          # Intentionally cache-free: without duration data, pytest-split gives each test equal weight and all shards compute the same partition.
          python -m pytest tests/unit \
            "${ignore_args[@]}" \
            -m "not live_service and not load" \
            --splits 4 \
            --group "${{ matrix.shard }}" \
            --splitting-algorithm least_duration \
            -vv

  frontend:
    name: Frontend (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        if: matrix.shard == 1
        run: cd frontend && npm run lint

      - name: Test (shard ${{ matrix.shard }}/2)
        run: cd frontend && npm run test:run -- --shard=${{ matrix.shard }}/2

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Social Signals fixture acceptance
        run: cd frontend && npx playwright test --grep "Social Signals"

      - name: Smoke test
        run: cd frontend && npm run test:smoke

  assistant-compose-smoke:
    name: Assistant Compose Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assistant profile compose smoke
        run: bash scripts/run_docker_assistant_compose_smoke.sh

  publish-images:
    name: Publish Docker Images
    needs: [backend, backend-postgres, backend-unit, frontend, frontend-e2e, assistant-compose-smoke]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Normalize GHCR owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/stockscreenclaude-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/stockscreenclaude-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image

  release:
    name: Create GitHub Release
    needs: [backend, frontend, publish-images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
