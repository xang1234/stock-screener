name: Static Site

on:
  schedule:
    # US/EU/Americas group — 4:10pm ET, after US close. Uses the New York
    # timezone so it tracks DST automatically.
    - cron: '10 16 * * 1-6'
      timezone: 'America/New_York'
    # Asian group — 6:30pm SGT, after all Asian markets close (incl. India,
    # which closes 3:30pm IST = 6:00pm SGT; the 30-min buffer lets prices
    # settle). Singapore has no DST, so 6:30pm SGT == 10:30 UTC year-round.
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      market_group:
        description: 'Which market group to build'
        type: choice
        default: all
        options:
          - all
          - asia
          - china
          - us
      rs_formula_overrides:
        description: 'Optional per-market RS rollback JSON, e.g. {"HK":"legacy-linear-v1"}; all others use balanced-horizon-percentile-v2'
        type: string
        default: '{}'

concurrency:
  group: static-site-${{ github.ref }}
  # Queue instead of cancel: GitHub often delays the Asia cron by 4-8h, so it
  # can still be running when the US cron fires. Cancelling it would discard
  # every Asian market's build and skip that group's publish entirely.
  # queue: max keeps every pending run; the default (single) lets a newer run
  # evict a pending one, e.g. a manual dispatch dropping the queued US run.
  queue: max
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  calendar-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pinned backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Audit official Market calendar coverage
        run: |
          cd backend
          if ! DRIFT_OUTPUT="$(python -m app.scripts.build_market_calendar_data --check 2>&1)"; then
            SAFE_DRIFT_OUTPUT="${DRIFT_OUTPUT//$'\n'/'%0A'}"
            echo "::warning::Market calendar generation drift detected: ${SAFE_DRIFT_OUTPUT}"
          fi
          python -m app.scripts.audit_market_calendars --github-actions

  select-markets:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      markets: ${{ steps.pick.outputs.markets }}
    steps:
      # Resolve which markets this run builds. The schedule that fired
      # (github.event.schedule) selects the group; manual dispatch uses the
      # market_group input. Each built market wakes static-site-publish.yml,
      # which publishes the newest artifact of every market, so a partial
      # group still publishes a complete site.
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MARKET_GROUP: ${{ github.event.inputs.market_group }}
        run: |
          ASIA='["HK","IN","JP","KR","TW","CN","SG","MY","AU"]'
          CN_ONLY='["CN"]'
          US='["US","CA","DE"]'
          ALL='["US","HK","IN","JP","KR","TW","CN","CA","DE","SG","AU","MY"]'

          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '30 10 * * 1-5') markets="$ASIA" ;;   # 10:30 UTC = 6:30pm SGT
              *)               markets="$US" ;;     # 4:10pm ET (America/New_York)
            esac
          else
            case "$MARKET_GROUP" in
              asia) markets="$ASIA" ;;
              china) markets="$CN_ONLY" ;;
              us)   markets="$US" ;;
              *)    markets="$ALL" ;;
            esac
          fi

          echo "markets=$markets" >> "$GITHUB_OUTPUT"
          echo "Building markets: $markets"

  ensure_daily_price_release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure static data releases exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view daily-price-data \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create daily-price-data \
            --repo "${{ github.repository }}" \
            --title "Daily Price Data" \
            --notes "Automated daily market-scoped OHLCV bundles for runtime bootstrap and refresh."
          gh release view rrg-history-data \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create rrg-history-data \
            --repo "${{ github.repository }}" \
            --title "RRG History Data" \
            --notes "Rolling compact weekly group-rank history for static RRG builds."
          gh release view options-analytics-data \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create options-analytics-data \
            --repo "${{ github.repository }}" \
            --title "Options Analytics History" \
            --notes "Checksummed aggregate-only US options history for ephemeral static builds."
          gh release view breadth-contributor-metadata-data \
            --repo "${{ github.repository }}" >/dev/null 2>&1 || \
          gh release create breadth-contributor-metadata-data \
            --repo "${{ github.repository }}" \
            --title "Breadth Contributor Metadata Data" \
            --notes "Rolling frozen company and IBD-group metadata for static breadth contributor drilldowns."

  build-cot:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && contains(fromJSON(needs.select-markets.outputs.markets), 'US') }}
    needs: select-markets
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockscanner
          POSTGRES_USER: stockscanner
          POSTGRES_PASSWORD: stockscanner
        options: >-
          --health-cmd "pg_isready -U stockscanner -d stockscanner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      REDIS_ENABLED: "false"
      DATABASE_URL: postgresql://stockscanner:stockscanner@localhost:5432/stockscanner
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Refresh and export global COT artifact
        run: |
          cd backend
          python -m app.scripts.export_static_cot \
            --output-dir /tmp/static-cot-build/cot

      - name: Upload current global COT artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-cot-global
          path: /tmp/static-cot-build/cot
          if-no-files-found: error

      - name: Wake static-site publisher
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static-site-publish.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

  build-market:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [select-markets, ensure_daily_price_release]
    runs-on: ubuntu-latest
    # Each market publishes independently through static-site-publish.yml, but a
    # stuck job still holds this run's concurrency slot (and its own market's
    # refresh) until GitHub's 6h job limit. Caps sit well above observed maxima (US ~210m, JP ~120m, others <= 85m); CN's is
    # provisional until the shared BaoStock session shows its new baseline.
    timeout-minutes: ${{ matrix.market == 'US' && 300 || (matrix.market == 'CN' && 240 || 150) }}
    strategy:
      fail-fast: false
      matrix:
        market: ${{ fromJSON(needs.select-markets.outputs.markets) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stockscanner
          POSTGRES_USER: stockscanner
          POSTGRES_PASSWORD: stockscanner
        options: >-
          --health-cmd "pg_isready -U stockscanner -d stockscanner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      REDIS_ENABLED: "false"
      DATABASE_URL: postgresql://stockscanner:stockscanner@localhost:5432/stockscanner
      # IN-specific yfinance throttle: smaller batches + 10s between batches to
      # stay under Yahoo's 429 window for the ~4.4k IN universe. Other markets
      # ignore these (the policy looks up settings.<provider>_<key>_<market>).
      YFINANCE_BATCH_SIZE_IN: "25"
      YFINANCE_BATCH_RATE_LIMIT_IN: "0.1"
      OPTIONS_ANALYTICS_ENABLED: ${{ matrix.market == 'US' && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Import weekly reference bundle
        env:
          GITHUB_DATA_TOKEN: ${{ github.token }}
        run: |
          cd backend
          python -m app.scripts.sync_weekly_reference_from_github \
            --market "${{ matrix.market }}" \
            --allow-stale

      - name: Load tracked IBD industry seed
        run: |
          cd backend
          python -m app.scripts.load_ibd_industry_groups \
            --csv ../data/IBD_industry_group.csv

      # Fills IBD groups for symbols/markets the curated CSV doesn't cover (new
      # listings, non-US markets) without overwriting CSV/manual rows. Additive
      # and non-fatal: if the classification release isn't published yet, the
      # build proceeds with CSV-only coverage.
      - name: Apply IBD classification (fills gaps beyond the CSV seed)
        continue-on-error: true
        env:
          GITHUB_DATA_TOKEN: ${{ github.token }}
        run: |
          cd backend
          python -m app.scripts.sync_ibd_classification_from_github \
            --market "${{ matrix.market }}" \
            --allow-stale

      - name: Seed daily price bundle from GitHub
        env:
          GITHUB_DATA_TOKEN: ${{ github.token }}
        run: |
          cd backend
          python -m app.scripts.sync_daily_price_bundle_from_github \
            --market "${{ matrix.market }}" \
            --allow-stale

      - name: Restore US options history
        id: restore-options-history
        if: ${{ matrix.market == 'US' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/options-history
          ASSET_NAME="options-history-us-v1.json.gz"
          PREVIOUS_ASSET_NAME="options-history-us-v1.previous.json.gz"
          rm -f "/tmp/options-history/$ASSET_NAME" "/tmp/options-history/$PREVIOUS_ASSET_NAME"
          cd backend
          alembic upgrade head
          RESTORE_STATUS=failed
          SAFE_TO_PUBLISH=false
          SOURCE_ASSET_NAME=""
          if ASSETS_JSON="$(gh release view options-analytics-data \
            --repo "${{ github.repository }}" \
            --json assets)"; then
            HISTORY_ASSET_PRESENT=false
            for CANDIDATE_ASSET_NAME in "$ASSET_NAME" "$PREVIOUS_ASSET_NAME"; do
              if jq -e --arg name "$CANDIDATE_ASSET_NAME" \
                'any(.assets[]; .name == $name)' <<< "$ASSETS_JSON" >/dev/null; then
                HISTORY_ASSET_PRESENT=true
                if gh release download options-analytics-data \
                  --repo "${{ github.repository }}" \
                  --pattern "$CANDIDATE_ASSET_NAME" \
                  --dir /tmp/options-history \
                  && python -m app.scripts.import_options_history \
                    --input "/tmp/options-history/$CANDIDATE_ASSET_NAME"; then
                  RESTORE_STATUS=restored
                  SAFE_TO_PUBLISH=true
                  SOURCE_ASSET_NAME="$CANDIDATE_ASSET_NAME"
                  break
                fi
              fi
            done
            if [ "$HISTORY_ASSET_PRESENT" = "false" ]; then
              RESTORE_STATUS=missing
              SAFE_TO_PUBLISH=true
            fi
          fi
          echo "restore_status=$RESTORE_STATUS" >> "$GITHUB_OUTPUT"
          echo "safe_to_publish=$SAFE_TO_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "source_asset_name=$SOURCE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          if [ "$RESTORE_STATUS" = "restored" ]; then
            echo "Restored US options history."
          elif [ "$RESTORE_STATUS" = "missing" ]; then
            echo "No prior US options history asset exists; starting fresh."
          else
            echo "Unable to restore US options history; history publication will be skipped." >&2
          fi

      - name: Plan rolling RRG history
        id: rrg-history
        run: |
          mkdir -p /tmp/rrg-history
          MARKET_LOWER="$(echo "${{ matrix.market }}" | tr '[:upper:]' '[:lower:]')"
          echo "MARKET_LOWER=${MARKET_LOWER}" >> "$GITHUB_ENV"
          cd backend
          PLAN="$(python -m app.scripts.describe_static_rrg_history \
            --market "${{ matrix.market }}" \
            --directory /tmp/rrg-history)"
          echo "enabled=$(jq -r '.enabled' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(jq -r '.asset_name' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          echo "source_path=$(jq -r '.source_path' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          echo "output_path=$(jq -r '.output_path' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          echo "RRG_HISTORY_DIR=/tmp/rrg-history" >> "$GITHUB_ENV"

      - name: Restore rolling RRG history
        id: restore-rrg-history
        if: ${{ steps.rrg-history.outputs.enabled == 'true' }}
        env:
          GITHUB_DATA_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.rrg-history.outputs.asset_name }}
          SOURCE_PATH: ${{ steps.rrg-history.outputs.source_path }}
        run: |
          rm -f "$SOURCE_PATH"
          cd backend
          RESTORE_RESULT="$(python -m app.scripts.restore_static_rrg_history \
            --repository "${{ github.repository }}" \
            --asset-name "$ASSET_NAME" \
            --output-path "$SOURCE_PATH" || true)"
          SAFE_TO_PUBLISH="$(jq -r '.safe_to_publish // false' <<<"$RESTORE_RESULT" 2>/dev/null || echo false)"
          RESTORE_STATUS="$(jq -r '.status // "failed"' <<<"$RESTORE_RESULT" 2>/dev/null || echo failed)"
          [ "$SAFE_TO_PUBLISH" = "true" ] || SAFE_TO_PUBLISH=false
          echo "safe_to_publish=$SAFE_TO_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "restore_status=$RESTORE_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$RESTORE_STATUS" = "restored" ]; then
            echo "Restored rolling RRG history for ${{ matrix.market }}."
          elif [ "$RESTORE_STATUS" = "missing" ]; then
            echo "No rolling RRG history found for ${{ matrix.market }}; the static exporter will bootstrap it."
          else
            echo "Unable to restore rolling RRG history for ${{ matrix.market }}; history publication will be skipped." >&2
          fi

      - name: Plan breadth contributor metadata
        id: breadth-contributor-metadata
        run: |
          mkdir -p /tmp/breadth-contributor-metadata
          cd backend
          PLAN="$(python -m app.scripts.describe_static_breadth_contributor_metadata \
            --market "${{ matrix.market }}" \
            --directory /tmp/breadth-contributor-metadata)"
          echo "enabled=$(jq -r '.enabled' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(jq -r '.asset_name' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          echo "previous_asset_name=$(jq -r '.previous_asset_name' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          echo "source_path=$(jq -r '.source_path' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          echo "previous_path=$(jq -r '.previous_path' <<<"$PLAN")" >> "$GITHUB_OUTPUT"
          echo "output_path=$(jq -r '.output_path' <<<"$PLAN")" >> "$GITHUB_OUTPUT"

      - name: Restore breadth contributor metadata
        id: restore-breadth-contributor-metadata
        if: ${{ steps.breadth-contributor-metadata.outputs.enabled == 'true' }}
        env:
          GITHUB_DATA_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.breadth-contributor-metadata.outputs.asset_name }}
          PREVIOUS_ASSET_NAME: ${{ steps.breadth-contributor-metadata.outputs.previous_asset_name }}
          SOURCE_PATH: ${{ steps.breadth-contributor-metadata.outputs.source_path }}
        run: |
          rm -f "$SOURCE_PATH"
          cd backend
          RESTORE_RESULT="$(python -m app.scripts.restore_static_breadth_contributor_metadata \
            --repository "${{ github.repository }}" \
            --market "${{ matrix.market }}" \
            --asset-name "$ASSET_NAME" \
            --previous-asset-name "$PREVIOUS_ASSET_NAME" \
            --output-path "$SOURCE_PATH" || true)"
          SAFE_TO_PUBLISH="$(jq -r '.safe_to_publish // false' <<<"$RESTORE_RESULT" 2>/dev/null || echo false)"
          RESTORE_STATUS="$(jq -r '.status // "failed"' <<<"$RESTORE_RESULT" 2>/dev/null || echo failed)"
          SOURCE_ASSET_NAME="$(jq -r '.source_asset_name // ""' <<<"$RESTORE_RESULT" 2>/dev/null || echo '')"
          [ "$SAFE_TO_PUBLISH" = "true" ] || SAFE_TO_PUBLISH=false
          echo "safe_to_publish=$SAFE_TO_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "restore_status=$RESTORE_STATUS" >> "$GITHUB_OUTPUT"
          echo "source_asset_name=$SOURCE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          if [ "$RESTORE_STATUS" = "restored" ]; then
            echo "Restored breadth contributor metadata for ${{ matrix.market }}."
          elif [ "$RESTORE_STATUS" = "missing" ]; then
            echo "No breadth contributor metadata found for ${{ matrix.market }}; the finalizer will bootstrap the newest 20 sessions."
          else
            echo "Unable to restore breadth contributor metadata for ${{ matrix.market }}; the market artifact will not be published." >&2
          fi

      # Restores last run's market_breadth rows so the exporter recomputes only
      # the newest sessions instead of the whole ~150-session window. Any
      # failure just means a full recompute, as before this step existed.
      - name: Restore breadth history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_NAME="breadth-history-${MARKET_LOWER}.json.gz"
          mkdir -p /tmp/breadth-history
          rm -f "/tmp/breadth-history/$ASSET_NAME"
          if ! gh release download daily-price-data \
            --repo "${{ github.repository }}" \
            --pattern "$ASSET_NAME" \
            --dir /tmp/breadth-history; then
            echo "No breadth history asset for ${{ matrix.market }}; breadth will be recomputed in full."
            exit 0
          fi
          cd backend
          python -m app.scripts.static_breadth_history_cache import \
            --market "${{ matrix.market }}" \
            --path "/tmp/breadth-history/$ASSET_NAME"

      - name: Export market static data bundle
        id: export-market
        env:
          RS_FORMULA_OVERRIDES: ${{ github.event.inputs.rs_formula_overrides || '{}' }}
          RRG_HISTORY_ENABLED: ${{ steps.rrg-history.outputs.enabled }}
          RRG_RESTORE_STATUS: ${{ steps.restore-rrg-history.outputs.restore_status }}
          BREADTH_METADATA_ENABLED: ${{ steps.breadth-contributor-metadata.outputs.enabled }}
          BREADTH_METADATA_RESTORE_STATUS: ${{ steps.restore-breadth-contributor-metadata.outputs.restore_status }}
        run: |
          cd backend
          breadth_metadata_args=()
          if [ "$BREADTH_METADATA_ENABLED" = "true" ]; then
            breadth_metadata_args=(
              --breadth-contributor-metadata-dir /tmp/breadth-contributor-metadata
              --breadth-contributor-metadata-restore-status "$BREADTH_METADATA_RESTORE_STATUS"
            )
          fi
          set +e
          EXPORT_LOG="$(mktemp)"
          python -m app.scripts.export_static_market_artifact \
            --output-dir /tmp/static-data \
            --refresh-daily \
            --build-mode price_delta \
            --skip-universe-refresh \
            --skip-fundamentals-refresh \
            --skip-cot-refresh \
            --market "${{ matrix.market }}" \
            --rs-formula-overrides-json "$RS_FORMULA_OVERRIDES" \
            --rrg-history-dir "$RRG_HISTORY_DIR" \
            "${breadth_metadata_args[@]}" 2>&1 | tee "$EXPORT_LOG"
          pipeline_status=("${PIPESTATUS[@]}")
          status="${pipeline_status[0]}"
          log_status="${pipeline_status[1]}"
          set -e
          if [ "$log_status" -ne 0 ]; then
            echo "Failed to persist the export log." >&2
            exit "$log_status"
          fi
          STATUS_PATH="/tmp/static-data/status/${MARKET_LOWER}/status.json"
          if [ "$status" -eq 78 ]; then
            echo "Market ${{ matrix.market }} is not a trading day; no current static artifact will be uploaded."
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
            echo "has_price_bundle=false" >> "$GITHUB_OUTPUT"
            echo "rrg_history_publishable=false" >> "$GITHUB_OUTPUT"
            echo "has_options_artifact=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -eq 79 ]; then
            echo "Market ${{ matrix.market }} produced diagnostics but no current market artifact will be uploaded; combine will use fallback artifacts if available."
            has_price_bundle="$(jq -r '.has_price_bundle // false' "$STATUS_PATH" 2>/dev/null || echo false)"
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
            echo "has_price_bundle=$has_price_bundle" >> "$GITHUB_OUTPUT"
            echo "rrg_history_publishable=false" >> "$GITHUB_OUTPUT"
            echo "has_options_artifact=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "has_price_bundle=true" >> "$GITHUB_OUTPUT"
          if grep -qE "using (benchmark-backed|previous-session) as-of date" "$EXPORT_LOG"; then
            echo "Rolling RRG history publication disabled for ${{ matrix.market }} because the market export rewound to an older as-of date."
            echo "rrg_history_publishable=false" >> "$GITHUB_OUTPUT"
          else
            echo "rrg_history_publishable=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$RRG_HISTORY_ENABLED" = "true" ] && [ "$RRG_RESTORE_STATUS" = "failed" ]; then
            echo "Rolling RRG history restore failed for ${{ matrix.market }}; current output will not replace the last good market artifact."
            echo "has_artifact=false" >> "$GITHUB_OUTPUT"
            echo "rrg_history_publishable=false" >> "$GITHUB_OUTPUT"
            echo "has_options_artifact=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ matrix.market }}" = "US" ] && [ -f /tmp/static-data/options/manifest.json ]; then
            echo "has_options_artifact=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_options_artifact=false" >> "$GITHUB_OUTPUT"
          fi
          echo "has_artifact=true" >> "$GITHUB_OUTPUT"

      - name: Upload market status
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: static-market-status-${{ matrix.market }}
          path: /tmp/static-data/status/${{ env.MARKET_LOWER }}/status.json
          if-no-files-found: error

      - name: Upload market diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: static-market-diagnostics-${{ matrix.market }}
          path: /tmp/static-data/diagnostics/${{ env.MARKET_LOWER }}
          if-no-files-found: ignore

      - name: Build daily price bundle
        id: build-daily-price-bundle
        if: ${{ steps.export-market.outputs.has_price_bundle == 'true' }}
        env:
          MARKET: ${{ matrix.market }}
        run: |
          cd backend
          MIN_SYMBOL_COVERAGE="$(python - <<'PY'
          import os
          from app.services.static_market_coverage_policy import static_daily_price_bundle_min_coverage

          print(static_daily_price_bundle_min_coverage(os.environ["MARKET"]))
          PY
          )"
          set +e
          BUILD_LOG="$(mktemp)"
          python -m app.scripts.build_daily_price_bundle \
            --market "$MARKET" \
            --output-dir /tmp/daily-price \
            --require-complete \
            --min-symbol-coverage "$MIN_SYMBOL_COVERAGE" 2>&1 | tee "$BUILD_LOG"
          build_pipeline_status=("${PIPESTATUS[@]}")
          status="${build_pipeline_status[0]}"
          build_log_status="${build_pipeline_status[1]}"
          set -e
          if [ "$build_log_status" -ne 0 ]; then
            echo "Failed to persist the daily price bundle build log." >&2
            exit "$build_log_status"
          fi
          if [ "$status" -ne 0 ]; then
            if grep -q "Daily price bundle coverage .* is below required" "$BUILD_LOG"; then
              echo "Daily price bundle publication skipped for $MARKET because current-session coverage is below the static publish threshold."
              echo "price_bundle_ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$status"
          fi
          echo "price_bundle_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload daily price assets
        if: ${{ steps.export-market.outputs.has_price_bundle == 'true' && steps.build-daily-price-bundle.outputs.price_bundle_ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MARKET_LOWER="$(echo "${{ matrix.market }}" | tr '[:upper:]' '[:lower:]')"
          BUNDLE_PATH="$(find /tmp/daily-price -maxdepth 1 -name "daily-price-${MARKET_LOWER}-*.json.gz" | head -n 1)"
          MANIFEST_PATH="/tmp/daily-price/daily-price-latest-${MARKET_LOWER}.json"

          if [ -z "$BUNDLE_PATH" ] || [ ! -f "$MANIFEST_PATH" ]; then
            echo "Missing daily price bundle outputs" >&2
            exit 1
          fi

          gh release upload daily-price-data "$BUNDLE_PATH" --clobber
          gh release upload daily-price-data "$MANIFEST_PATH" --clobber

      - name: Publish breadth history
        if: ${{ steps.export-market.outputs.has_artifact == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET_PATH="/tmp/breadth-history/breadth-history-${MARKET_LOWER}.json.gz"
          cd backend
          python -m app.scripts.static_breadth_history_cache export \
            --market "${{ matrix.market }}" \
            --path "$ASSET_PATH"
          gh release upload daily-price-data "$ASSET_PATH" --clobber

      - name: Publish breadth contributor metadata
        id: publish-breadth-contributor-metadata
        if: ${{ steps.export-market.outputs.has_artifact == 'true' && steps.breadth-contributor-metadata.outputs.enabled == 'true' && steps.restore-breadth-contributor-metadata.outputs.safe_to_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.breadth-contributor-metadata.outputs.asset_name }}
          PREVIOUS_ASSET_NAME: ${{ steps.breadth-contributor-metadata.outputs.previous_asset_name }}
          SOURCE_PATH: ${{ steps.breadth-contributor-metadata.outputs.source_path }}
          PREVIOUS_PATH: ${{ steps.breadth-contributor-metadata.outputs.previous_path }}
          METADATA_PATH: ${{ steps.breadth-contributor-metadata.outputs.output_path }}
          RESTORE_STATUS: ${{ steps.restore-breadth-contributor-metadata.outputs.restore_status }}
          SOURCE_ASSET_NAME: ${{ steps.restore-breadth-contributor-metadata.outputs.source_asset_name }}
        run: |
          if [ ! -s "$METADATA_PATH" ]; then
            echo "No current breadth contributor metadata state was produced; the market artifact will use its last-good fallback."
            echo "metadata_state_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RESTORE_STATUS" = "restored" ] && [ "$SOURCE_ASSET_NAME" = "$ASSET_NAME" ]; then
            cp "$SOURCE_PATH" "$PREVIOUS_PATH"
            previous_published=false
            for attempt in 1 2 3; do
              if gh release upload breadth-contributor-metadata-data "$PREVIOUS_PATH" --clobber; then
                previous_published=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            if [ "$previous_published" != "true" ]; then
              echo "Unable to preserve the last-good breadth contributor metadata; canonical replacement was not attempted." >&2
              echo "metadata_state_published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          for attempt in 1 2 3; do
            if gh release upload breadth-contributor-metadata-data "$METADATA_PATH" --clobber; then
              echo "metadata_state_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Unable to publish breadth contributor metadata; the market artifact will use its last-good fallback." >&2
          echo "metadata_state_published=false" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload market artifact
        id: upload-market-artifact
        if: ${{ steps.export-market.outputs.has_artifact == 'true' && (steps.breadth-contributor-metadata.outputs.enabled != 'true' || steps.publish-breadth-contributor-metadata.outputs.metadata_state_published == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: static-market-${{ matrix.market }}
          path: /tmp/static-data/markets/${{ env.MARKET_LOWER }}
          if-no-files-found: error

      - name: Upload current US options artifact
        if: ${{ steps.export-market.outputs.has_options_artifact == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: static-options-US
          path: /tmp/static-data/options
          if-no-files-found: error

      - name: Publish US options history
        if: ${{ steps.export-market.outputs.has_options_artifact == 'true' && steps.restore-options-history.outputs.safe_to_publish == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: options-history-us-v1.json.gz
          PREVIOUS_ASSET_NAME: options-history-us-v1.previous.json.gz
          RESTORED_PATH: /tmp/options-history/options-history-us-v1.json.gz
          PREVIOUS_PATH: /tmp/options-history-us-v1.previous.json.gz
          RESTORE_STATUS: ${{ steps.restore-options-history.outputs.restore_status }}
          SOURCE_ASSET_NAME: ${{ steps.restore-options-history.outputs.source_asset_name }}
        run: |
          RUN_ID="$(jq -r '.published_run_id' /tmp/static-data/options/manifest.json)"
          cd backend
          python -m app.scripts.export_options_history \
            --output /tmp/options-history-us-v1.json.gz \
            --require-run-id "$RUN_ID"
          if [ "$RESTORE_STATUS" = "restored" ] && [ "$SOURCE_ASSET_NAME" = "$ASSET_NAME" ]; then
            cp "$RESTORED_PATH" "$PREVIOUS_PATH"
            previous_published=false
            for attempt in 1 2 3; do
              if gh release upload options-analytics-data \
                "$PREVIOUS_PATH" --clobber; then
                previous_published=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done
            if [ "$previous_published" != "true" ]; then
              echo "Unable to preserve last-good options history; canonical replacement was not attempted." >&2
              exit 1
            fi
          fi
          for attempt in 1 2 3; do
            if gh release upload options-analytics-data \
              /tmp/options-history-us-v1.json.gz --clobber; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Unable to advance options history; the current static artifact remains valid." >&2
          exit 1

      - name: Publish rolling RRG history
        if: ${{ steps.export-market.outputs.has_artifact == 'true' && (steps.breadth-contributor-metadata.outputs.enabled != 'true' || steps.publish-breadth-contributor-metadata.outputs.metadata_state_published == 'true') && steps.export-market.outputs.rrg_history_publishable == 'true' && steps.rrg-history.outputs.enabled == 'true' && steps.restore-rrg-history.outputs.safe_to_publish == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_PATH: ${{ steps.rrg-history.outputs.output_path }}
        run: |
          if [ ! -s "$HISTORY_PATH" ]; then
            echo "No current rolling RRG history was produced; market publication remains valid."
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh release upload rrg-history-data "$HISTORY_PATH" --clobber; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "Unable to advance rolling RRG history; the market artifact was already uploaded." >&2
          exit 1

      # Runs after any later step failure so an uploaded market is never left
      # waiting for the next export run.
      - name: Wake static-site publisher
        if: ${{ always() && steps.upload-market-artifact.outcome == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static-site-publish.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

  # Catch-all wake-up: covers a market that uploaded and was cancelled before
  # its own wake step. Duplicate wake-ups coalesce in the publisher's
  # concurrency group, and every publish is "newest artifact per market".
  wake-publisher:
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: [select-markets, build-cot, build-market]
    runs-on: ubuntu-latest
    steps:
      - name: Wake static-site publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run static-site-publish.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"
