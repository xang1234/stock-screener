name: Static Site Publish

# Stateless publisher (#499): every run publishes the newest valid artifact per
# market, found by name, so wake-ups may be lost, duplicated or coalesced and
# the next run converges. Producers in static-site.yml wake it; no schedule.
on:
  # No inputs: a publish-time RS override could not stick (the next wake-up
  # republishes the newest artifacts). An RS rollback is a static-site.yml
  # export run with rs_formula_overrides; its legacy artifact becomes the
  # newest one and is published like any other.
  workflow_dispatch:
  # Build-only rehearsal for PRs that change the publisher; never deploys.
  pull_request:
    paths:
      - .github/workflows/static-site-publish.yml
      - backend/app/scripts/download_static_market_fallbacks.py
      - backend/app/scripts/validate_static_market_artifacts.py
      - backend/app/services/static_artifact_combiner.py
      - backend/app/services/static_advertised_paths.py
      - backend/app/scripts/export_static_site.py
      - backend/app/scripts/report_static_market_freshness.py
      - backend/app/services/static_site_export_service.py
      - backend/app/services/static_global_artifacts.py
      - backend/app/services/static_market_artifact_contract.py

concurrency:
  # One production publish at a time; a newer pending run replaces an older
  # pending one, which is safe because every run publishes "latest per market".
  # Rehearsals (PRs, dispatches on other branches) get a per-ref group so they
  # can never displace a pending production publish.
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'static-site-publisher' || format('static-site-publisher-{0}', github.ref) }}
  cancel-in-progress: false

# Granted per job. build runs PR code and third-party installs, so it is
# read-only: it can neither mint an OIDC token nor delete stored market
# artifacts. Every write happens in the production-only deploy job.
permissions: {}

jobs:
  build:
    permissions:
      actions: read
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      pages_artifact_id: ${{ steps.upload-pages-artifact.outputs.artifact_id }}
    env:
      REDIS_ENABLED: "false"
      DATABASE_URL: postgresql://stockscanner:stockscanner@localhost:5432/stockscanner

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Artifacts from runs still in progress are included: upload-artifact v4
      # artifacts are served by the API as soon as they are uploaded.
      - name: Download newest market artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH_NAME: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p /tmp/static-empty
          cd backend
          python -m app.scripts.download_static_market_fallbacks \
            --current-dir /tmp/static-empty \
            --fallback-dir /tmp/static-market-artifacts \
            --fallback-options-dir /tmp/static-options \
            --fallback-cot-dir /tmp/static-cot

      # The selection holds stored last-good artifacts, not this run's exports,
      # so it is passed as the fallback input: an artifact that predates the
      # balanced RS rollout or the current breadth revision is accepted (or
      # skipped) instead of failing every market's publish.
      - name: Validate market artifacts
        run: |
          mkdir -p /tmp/static-market-artifacts
          cd backend
          python -m app.scripts.validate_static_market_artifacts \
            --current-dir /tmp/static-empty \
            --fallback-dir /tmp/static-market-artifacts \
            --fallback-options-dir /tmp/static-options \
            --fallback-cot-dir /tmp/static-cot \
            --selected-markets '[]'

      - name: Combine static data bundle
        run: |
          cd backend
          python -m app.scripts.export_static_site \
            --output-dir ../frontend/public/static-data \
            --combine-artifacts-dir /tmp/static-empty \
            --fallback-artifacts-dir /tmp/static-market-artifacts \
            --fallback-options-artifacts-dir /tmp/static-options \
            --fallback-cot-artifacts-dir /tmp/static-cot

      # Reporting only (#484): never blocks the deploy. Stale or missing markets
      # surface as annotations and a table on the run summary.
      - name: Report market freshness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/daily-price-manifests
          gh release download daily-price-data \
            --repo "${{ github.repository }}" \
            --pattern 'daily-price-latest-*.json' \
            --dir /tmp/daily-price-manifests \
            || echo "Daily price manifests unavailable; bundle freshness will be blank."
          cd backend
          python -m app.scripts.report_static_market_freshness \
            --manifest ../frontend/public/static-data/manifest.json \
            --artifacts-dir /tmp/static-market-artifacts \
            --price-manifest-dir /tmp/daily-price-manifests \
            --selected-markets '[]'

      - name: Build static frontend
        env:
          VITE_STATIC_SITE: "true"
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: cd frontend && npm run build

      - name: Upload Pages artifact
        id: upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Prune duplicate Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          KEEP_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          keep_artifact_id = int(os.environ["KEEP_ARTIFACT_ID"])

          result = subprocess.run(
              [
                  "gh",
                  "api",
                  "--paginate",
                  "--slurp",
                  f"repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          pages = json.loads(result.stdout)
          payload = {
              "artifacts": [
                  artifact
                  for page in pages
                  for artifact in page.get("artifacts", [])
              ]
          }
          duplicates = [
              artifact["id"]
              for artifact in payload.get("artifacts", [])
              if artifact.get("name") == "github-pages" and artifact.get("id") != keep_artifact_id
          ]

          if not duplicates:
              print("No duplicate github-pages artifacts found.", flush=True)
              raise SystemExit(0)

          print(
              f"::warning::Pruning {len(duplicates)} duplicate github-pages artifact(s) "
              f"from run {run_id}; keeping {keep_artifact_id}.",
              flush=True,
          )
          for artifact_id in duplicates:
              subprocess.run(
                  ["gh", "api", "--method", "DELETE", f"repos/{repo}/actions/artifacts/{artifact_id}"],
                  check=True,
              )
              print(f"Deleted duplicate github-pages artifact {artifact_id}.", flush=True)
          PY

      - id: deployment
        uses: actions/deploy-pages@v5
