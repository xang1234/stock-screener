# Company exposure research — opt-in overlay.
#
# Merge explicitly after the base (and prod) files, e.g.:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.exposure.yml --profile exposure-research up -d
#
# Before first start (see docs/runbooks/company-exposure-map.md):
#   mkdir -p ./data/exposure-evidence && sudo chown -R 1000:1000 ./data/exposure-evidence
#
# Starting this worker does not enable research: EXPOSURE_RESEARCH_MODE
# defaults to "disabled", paid search stays off, and the OpenCode Go routes
# and local allocation must be configured explicitly.
#
# This file is separate from docker-compose.yml so deployments that never use
# the feature get no extra mounts or directories.

services:
  backend:
    environment:
      EXPOSURE_DOCUMENT_STORE: /app/data/exposure-evidence
      EXPOSURE_RESEARCH_MODE: ${EXPOSURE_RESEARCH_MODE:-disabled}
    volumes:
      # The API only serves authorized excerpts/originals; it never writes blobs.
      - ./data/exposure-evidence:/app/data/exposure-evidence:ro

  celery-exposure-research:
    profiles: ["exposure-research"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_THEME_ML: "false"
        INSTALL_EXPOSURE_DOCUMENTS: "true"
    image: stockscreen-exposure-worker:local
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - --pool=prefork
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=25
      - --without-mingle
      - --without-gossip
      - -Q
      - exposure_research
      - -n
      - exposure-research@%h
    # Narrow environment: only what research needs. Do not inherit the broad
    # application secret set (no env_file, no x-app-env anchor).
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stockscanner}:${POSTGRES_PASSWORD:-stockscanner}@postgres:5432/${POSTGRES_DB:-stockscanner}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TZ: ${CELERY_TIMEZONE:-America/New_York}
      CELERY_TIMEZONE: ${CELERY_TIMEZONE:-America/New_York}
      HOME: /tmp
      EXPOSURE_RESEARCH_MODE: ${EXPOSURE_RESEARCH_MODE:-disabled}
      EXPOSURE_PAID_SEARCH_ENABLED: ${EXPOSURE_PAID_SEARCH_ENABLED:-false}
      EXPOSURE_SEARCH_PROVIDER: ${EXPOSURE_SEARCH_PROVIDER:-none}
      EXPOSURE_LLM_TEXT_ROUTE_ENABLED: ${EXPOSURE_LLM_TEXT_ROUTE_ENABLED:-false}
      EXPOSURE_LLM_VISION_ROUTE_ENABLED: ${EXPOSURE_LLM_VISION_ROUTE_ENABLED:-false}
      EXPOSURE_LLM_DAILY_REQUEST_LIMIT: ${EXPOSURE_LLM_DAILY_REQUEST_LIMIT:-}
      EXPOSURE_LLM_DAILY_TOKEN_LIMIT: ${EXPOSURE_LLM_DAILY_TOKEN_LIMIT:-}
      EXPOSURE_ALLOCATION_TIMEZONE: ${EXPOSURE_ALLOCATION_TIMEZONE:-UTC}
      EXPOSURE_SEC_USER_AGENT: ${EXPOSURE_SEC_USER_AGENT:-}
      EXPOSURE_DOCUMENT_STORE: /app/data/exposure-evidence
      EXPOSURE_STORAGE_MAX_BYTES: ${EXPOSURE_STORAGE_MAX_BYTES:-5368709120}
      EXPOSURE_STORAGE_MIN_FREE_BYTES: ${EXPOSURE_STORAGE_MIN_FREE_BYTES:-1073741824}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_API_BASE: ${OPENCODE_GO_API_BASE:-https://opencode.ai/zen/go/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    volumes:
      - ./data/exposure-evidence:/app/data/exposure-evidence
    tmpfs:
      - /tmp:size=536870912,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          memory: 256M
    stop_grace_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d exposure-research@$$HOSTNAME"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
