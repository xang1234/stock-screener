# Security headers for every response. Included at server level and again in
# any location with its own add_header, because nginx drops inherited
# add_header directives from a location that sets one.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' http: https: ws: wss:; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; frame-src 'self' https://stockbee.blogspot.com https://s.tradingview.com https://www.tradingview.com; img-src 'self' data: https:; object-src 'none'; script-src 'self' https://s3.tradingview.com; style-src 'self' 'unsafe-inline';" always;
