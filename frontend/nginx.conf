# Stock Scanner nginx configuration
# Works for the supported single-tenant server deployment path.

set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;  # Catch-all - works for any domain/localhost
    root /usr/share/nginx/html;
    index index.html;

    # Security headers - safe for all environments
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression for faster transfers
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Health check endpoint for container orchestration
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # SPA routing - serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://backend:8000/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Proxy API requests to backend
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        # A watchlist import may hold 1,000,000 characters; JSON escaping and
        # UTF-8 can make that several MB, past nginx's 1 MiB default.
        client_max_body_size 8m;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Extended timeouts for long-running scans
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Buffer settings for large responses. Scan result pages and group /
        # breadth bootstraps routinely exceed 128KB of JSON; keep them in
        # memory instead of spilling to a temp file on every request.
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }

    # Pre-baked static-data bundles from the scheduled export. Short public
    # cache: repeat views are free, daily rebuilds propagate within minutes.
    location /static-data/ {
        alias /usr/share/nginx/static-data/;
        # expires sets Cache-Control; with no header directive of its own the
        # block keeps the server's security headers.
        expires 5m;
        try_files $uri =404;
    }

    # Cache static assets with long expiry. Everything here is content-hashed;
    # ^~ keeps the extension regex below from claiming its fonts and images.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # This add_header drops the inherited ones, so repeat them.
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Favicon and static files. No add_header here: one would drop the server's
    # security headers (CSP matters for SVG), and expires sets Cache-Control.
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
    }
}
